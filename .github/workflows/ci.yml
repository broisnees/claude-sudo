name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq libsecret-tools gnome-keyring dbus-x11 shellcheck pass gnupg

      - name: Shell syntax
        run: |
          for f in bin/claude-sudo bin/claude-sudo-statusline install.sh uninstall.sh \
                   hooks/*.sh lib/*.sh libexec/claude-sudo-askpass libexec/shim/sudo tests/smoke.sh; do
            bash -n "$f" || exit 1
          done

      - name: Shellcheck
        run: |
          # Executables get the full check.
          shellcheck -S warning -e SC1090,SC1091 \
            bin/claude-sudo bin/claude-sudo-statusline install.sh uninstall.sh \
            hooks/*.sh libexec/claude-sudo-askpass libexec/shim/sudo
          # Libraries are sourced, so SC2034 "appears unused" is a false positive
          # by construction: their variables are consumed by the callers.
          shellcheck -S warning -e SC1090,SC1091,SC2034 lib/*.sh

      - name: JSON manifests
        run: |
          jq -e . hooks/hooks.json
          jq -e . .claude-plugin/plugin.json
          jq -e . .claude-plugin/marketplace.json

      # The suite needs a secret store that actually answers. It skips those tests
      # gracefully when there is none — right on a user's machine, but here it
      # would silently drop ~37 assertions, so a skip is a failure.
      #
      # gnome-keyring headless is famously unreliable, so it is probed rather than
      # assumed: if the probe fails, the deterministic `pass` backend takes over.
      # Either way the same logic gets exercised.
      - name: Secret store
        run: |
          mkdir -p ~/.local/share/keyrings
          if dbus-run-session -- bash -c '
                echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
                printf probe | secret-tool store --label=probe claude-sudo-probe yes >/dev/null 2>&1 \
                  && [ "$(secret-tool lookup claude-sudo-probe yes 2>/dev/null)" = probe ]'; then
            echo "backend=libsecret" >>"$GITHUB_ENV"
            echo "libsecret answers; testing against gnome-keyring"
          else
            gpg --batch --quick-generate-key --passphrase '' ci@claude-sudo.test default default never
            pass init ci@claude-sudo.test
            echo "backend=pass" >>"$GITHUB_ENV"
            echo "no usable keyring; testing against the pass backend"
          fi

      - name: Smoke tests
        run: |
          set -o pipefail
          if [ "$backend" = libsecret ]; then
            dbus-run-session -- bash -c '
              echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
              bash tests/smoke.sh
            ' | tee /tmp/smoke.out
          else
            CLAUDE_SUDO_BACKEND=pass bash tests/smoke.sh | tee /tmp/smoke.out
          fi
          if grep -q "no usable keyring" /tmp/smoke.out; then
            echo "::error::vault-backed tests were skipped; CI must exercise them"
            exit 1
          fi

      - name: Version is consistent
        run: |
          lib=$(sed -n 's/^CLAUDE_SUDO_VERSION="\(.*\)"/\1/p' lib/common.sh | head -1)
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          echo "lib=$lib plugin=$plugin"
          [ "$lib" = "$plugin" ]
