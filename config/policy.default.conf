# claude-sudo default policy: TAB-separated: action:name<TAB>regex<TAB>reason
# Don't edit this file: put overrides in ~/.config/claude-sudo/policy.conf, which
# is layered on top (see `claude-sudo policy help`). The names are stable so a
# user file can switch a single rule off.
#
# deny = blocked even in sudo mode. ask = drops back to a normal permission prompt.
# A deny anywhere beats an ask, whatever the order.

# --- unrecoverable ---------------------------------------------------------
deny:rm-root	(^|[;&|(`[:space:]])rm[[:space:]]+(-[^[:space:]]+[[:space:]]+)*/(\*)?([[:space:]]|;|&|$)	rm targeting the filesystem root
deny:rm-system	(^|[;&|(`[:space:]])rm[[:space:]]+(-[^[:space:]]+[[:space:]]+)*(/(usr|etc|var|boot|bin|sbin|lib|home|root)|\$HOME|~)/?([[:space:]]|;|&|$)	recursive delete of a system or home directory
deny:mkfs	(^|[;&|(`[:space:]])mkfs(\.[a-z0-9]+)?([[:space:]]|$)	filesystem creation would destroy a volume
deny:disk-wipe	(^|[;&|(`[:space:]])(wipefs|shred|blkdiscard)([[:space:]]|$)	destructive disk wipe
deny:dd-device	dd[[:space:]][^|;&]*of=/dev/(sd|hd|nvme|vd|mmcblk|disk|rdisk)	raw write to a block device
deny:redirect-device	(>|>>)[[:space:]]*/dev/(sd|hd|nvme|vd|mmcblk|disk|rdisk)	raw redirect onto a block device
deny:fork-bomb	:[[:space:]]*\(\)[[:space:]]*\{[[:space:]]*:[[:space:]]*\|[[:space:]]*:	fork bomb
deny:power	(^|[;&|(`[:space:]])(shutdown|reboot|poweroff|halt|kexec)([[:space:]]|$)	changes host power state and would kill this session
deny:user-delete	(^|[;&|(`[:space:]])(userdel|groupdel)[[:space:]]	account deletion
deny:chmod-root	chmod[[:space:]]+(-[^[:space:]]+[[:space:]]+)*(0)?777[[:space:]]+/([[:space:]]|$)	world-writable filesystem root
deny:chown-root	(^|[;&|(`[:space:]])(chown|chmod)[[:space:]]+(-[^[:space:]]+[[:space:]]+)*[^[:space:]]+[[:space:]]+/([[:space:]]|$)	recursive ownership change on the filesystem root
deny:curl-shell	(curl|wget)[^|;&]*\|[[:space:]]*(sudo[[:space:]]+)?(ba|z|da)?sh	piping a download straight into a shell
deny:root-shell	(^|[;&|(`[:space:]])sudo[[:space:]]+(-[^[:space:]]+[[:space:]]+)*(su|-i|-s)([[:space:]]|$)	interactive root shell (claude-sudo cannot audit what runs inside it)

# --- needs a human decision, so hand it back to the normal prompt ----------
ask:credential-files	/etc/(sudoers|shadow|passwd|group|gshadow)	touches privilege and credential files
ask:accounts	(^|[;&|(`[:space:]])(visudo|passwd|chpasswd|usermod|useradd|groupadd)([[:space:]]|$)	changes accounts or credentials
ask:ssh	\.ssh/(id_[a-z0-9]+|authorized_keys|config)	touches SSH keys or SSH config
ask:firewall	(^|[;&|(`[:space:]])(iptables|ip6tables|nft|ufw|firewall-cmd)([[:space:]]|$)	changes firewall rules
ask:service-stop	(^|[;&|(`[:space:]])systemctl[[:space:]]+(-[^[:space:]]+[[:space:]]+)*(mask|disable|stop)[[:space:]]	stops or disables a system service
ask:package-remove	(^|[;&|(`[:space:]])(pacman|apt|apt-get|dnf|yum|zypper|apk)[[:space:]][^;&|]*(-R|--remove|[[:space:]]remove|[[:space:]]purge|[[:space:]]erase|-Rns)	removes system packages
ask:partition	(^|[;&|(`[:space:]])(fdisk|parted|sgdisk|cfdisk|cryptsetup|lvremove|vgremove)([[:space:]]|$)	partition or volume management
ask:crontab	(^|[;&|(`[:space:]])crontab[[:space:]]	changes scheduled jobs
ask:vault	claude-sudo[[:space:]]+(forget|passwd)	changes the claude-sudo vault itself
