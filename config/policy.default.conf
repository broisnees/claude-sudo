# claude-sudo default policy — TAB-separated: action<TAB>regex<TAB>reason
# Copy to ~/.config/claude-sudo/policy.conf to customise (that file fully replaces this one).
#
# deny = blocked even in sudo mode. ask = drops back to a normal permission prompt.
# First match wins, so deny rules come first.

# --- unrecoverable ---------------------------------------------------------
deny	(^|[;&|(`[:space:]])rm[[:space:]]+(-[^[:space:]]+[[:space:]]+)*/(\*)?([[:space:]]|;|&|$)	rm targeting the filesystem root
deny	(^|[;&|(`[:space:]])rm[[:space:]]+(-[^[:space:]]+[[:space:]]+)*(/(usr|etc|var|boot|bin|sbin|lib|home|root)|\$HOME|~)/?([[:space:]]|;|&|$)	recursive delete of a system or home directory
deny	(^|[;&|(`[:space:]])mkfs(\.[a-z0-9]+)?([[:space:]]|$)	filesystem creation would destroy a volume
deny	(^|[;&|(`[:space:]])(wipefs|shred|blkdiscard)([[:space:]]|$)	destructive disk wipe
deny	dd[[:space:]][^|;&]*of=/dev/(sd|hd|nvme|vd|mmcblk|disk|rdisk)	raw write to a block device
deny	(>|>>)[[:space:]]*/dev/(sd|hd|nvme|vd|mmcblk|disk|rdisk)	raw redirect onto a block device
deny	:[[:space:]]*\(\)[[:space:]]*\{[[:space:]]*:[[:space:]]*\|[[:space:]]*:	fork bomb
deny	(^|[;&|(`[:space:]])(shutdown|reboot|poweroff|halt|kexec)([[:space:]]|$)	changes host power state and would kill this session
deny	(^|[;&|(`[:space:]])(userdel|groupdel)[[:space:]]	account deletion
deny	chmod[[:space:]]+(-[^[:space:]]+[[:space:]]+)*(0)?777[[:space:]]+/([[:space:]]|$)	world-writable filesystem root
deny	(^|[;&|(`[:space:]])(chown|chmod)[[:space:]]+(-[^[:space:]]+[[:space:]]+)*[^[:space:]]+[[:space:]]+/([[:space:]]|$)	recursive ownership change on the filesystem root
deny	(curl|wget)[^|;&]*\|[[:space:]]*(sudo[[:space:]]+)?(ba|z|da)?sh	piping a download straight into a shell
deny	(^|[;&|(`[:space:]])sudo[[:space:]]+(-[^[:space:]]+[[:space:]]+)*(su|-i|-s)([[:space:]]|$)	interactive root shell (claude-sudo cannot audit what runs inside it)

# --- needs a human decision, so hand it back to the normal prompt ----------
ask	/etc/(sudoers|shadow|passwd|group|gshadow)	touches privilege and credential files
ask	(^|[;&|(`[:space:]])(visudo|passwd|chpasswd|usermod|useradd|groupadd)([[:space:]]|$)	changes accounts or credentials
ask	\.ssh/(id_[a-z0-9]+|authorized_keys|config)	touches SSH keys or SSH config
ask	(^|[;&|(`[:space:]])(iptables|ip6tables|nft|ufw|firewall-cmd)([[:space:]]|$)	changes firewall rules
ask	(^|[;&|(`[:space:]])systemctl[[:space:]]+(-[^[:space:]]+[[:space:]]+)*(mask|disable|stop)[[:space:]]	stops or disables a system service
ask	(^|[;&|(`[:space:]])(pacman|apt|apt-get|dnf|yum|zypper|apk)[[:space:]][^;&|]*(-R|--remove|[[:space:]]remove|[[:space:]]purge|[[:space:]]erase|-Rns)	removes system packages
ask	(^|[;&|(`[:space:]])(fdisk|parted|sgdisk|cfdisk|cryptsetup|lvremove|vgremove)([[:space:]]|$)	partition or volume management
ask	(^|[;&|(`[:space:]])crontab[[:space:]]	changes scheduled jobs
ask	claude-sudo[[:space:]]+(forget|passwd)	changes the claude-sudo vault itself
